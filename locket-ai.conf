# NguyenBaTai | Locket + YouTube | Shadowrocket
# Based on user's 17in1public.conf (2026-11-13)
# NOTE: No paid entitlement is guaranteed by this config.
# IMPORTANT: Generate your OWN HTTPS interception certificate in Shadowrocket.
# Do not import/reuse the CA certificate embedded in the original file.

[General]
# No remote update-url: prevent external updates from silently overwriting this local config.
bypass-system = true
skip-proxy = 127.0.0.1, localhost, *.local

[Rule]
# YouTube QUIC can bypass HTTP(S) filtering; limit rule to YouTube video endpoints.
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT
FINAL,DIRECT

[URL Rewrite]
# Locket PTB / AI Filter: route image-generation requests via the endpoint
# included in the USER-SUPPLIED original config. THIRD-PARTY SERVICE:
# photos/requests may be transmitted to locket-vip.mhiep20077.workers.dev.
# Disable the following rule if you do not trust this service.
^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage https://locket-vip.mhiep20077.workers.dev/generateFilteredImage?module=Locket_YouTube 307

# YouTube telemetry/ad endpoints. Blocking may be incomplete.
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads - reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) - reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext - reject-200

[Header Rewrite]
# Avoid cached Locket remote config during troubleshooting.
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-none-match

[Script]
# YouTube player/ad filtering from the source config; third-party code, inspect before enabling.
youtube.request = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|reel\/reel_watch_sequence|get_watch),requires-body=true,max-size=-1,binary-body-mode=true,engine=jsc,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/Youtube.respones.js
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)(\?.*)?$,requires-body=true,max-size=-1,binary-body-mode=true,engine=jsc,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/Youtube.respones.js

# Locket remote-config + PTB/Photobooth + AI filter hooks from the original config.
# These cannot guarantee Gold / PTB server-side entitlements or AI filter access.
locket_remote_config = type=http-response,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/locketpublic.js?v=20261108_15,requires-body=true,max-size=-1,timeout=60
locket_ai_filter = type=http-request,pattern=^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/photoboth.js?v=20261108_15,requires-body=true,max-size=-1,timeout=60

# A RevenueCat response modifier from the original file, DISABLED by default:
# it affects subscription data across unrelated apps unless appropriately scoped.
# locket_purchase = type=http-response,pattern=^https:\/\/api\.revenuecat\.com\/v1\/subscribers\/.+,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/revenuecatNEW.js,requires-body=true,max-size=-1,timeout=60

[MITM]
enable = true
h2 = true
hostname = firebaseremoteconfig.googleapis.com, api.locketcamera.com, us-central1-locket-4252a.cloudfunctions.net, youtubei.googleapis.com, www.youtube.com, s.youtube.com
