# NguyenBaTai Shadowrocket | Locket PTB AI + YouTube
# Revised against user-provided 17in1public.conf (2026-11-13)
# NOT an official Locket Gold or YouTube Premium subscription.
# HTTPS decryption requires a certificate generated and trusted on YOUR iPhone.
# Third-party scripts may access intercepted requests; use with caution.

[General]
bypass-system = true
skip-proxy = 127.0.0.1, localhost, *.local

[Rule]
# HTTP/3 (QUIC) may bypass HTTPS rewrite for affected endpoints.
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,firebaseremoteconfig.googleapis.com),(PROTOCOL,UDP)),REJECT
FINAL,DIRECT

[Host]
firebaseremoteconfigrealtime.googleapis.com = 0.0.0.0

[URL Rewrite]
# From 17in1public: these may reduce some YouTube ads, NOT grant Premium.
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext reject-200
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302

# Locket PTB/AI Filter proxy from original config, DISABLED for safety.
# This sends private photos to a third-party endpoint if enabled.
# ^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage https://locket-vip.mhiep20077.workers.dev/generateFilteredImage?module=Locket_YouTube 307

[Header Rewrite]
# Correct Shadowrocket http-request syntax as in the original.
http-request ^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-none-match
http-request ^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-None-Match
http-request ^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-modified-since
http-request ^https?:\/\/api\.locketcamera\.com\/.+ header-del if-none-match

[Script]
# YouTube original script; fixed invalid engine={{{script}}} placeholder.
youtube.request = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|reel\/reel_watch_sequence|get_watch),requires-body=true,max-size=-1,binary-body-mode=true,engine=jsc,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/Youtube.respones.js
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)(\?.*)?$,requires-body=true,max-size=-1,binary-body-mode=true,engine=jsc,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/Youtube.respones.js

# Locket remote configuration + PTB hook from the supplied config.
locket_rc = type=http-response,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/locketpublic.js?v=20261108_15,requires-body=true,max-size=-1,timeout=60
locket_pb_req = type=http-request,pattern=^https?:\/\/(us-central1-locket-4252a\.cloudfunctions\.net|api\.locketcamera\.com)\/generateFilteredImage,script-path=https://raw.githubusercontent.com/andanh447/locketgold_tool/main/photoboth.js?v=20261108_15,requires-body=true,max-size=-1,timeout=60

# No global RevenueCat or receipt spoofing: can affect unrelated apps.
# Access to paid AI/Gold/Premium features depends on the service account.

[MITM]
enable = true
h2 = true
hostname = firebaseremoteconfig.googleapis.com, api.locketcamera.com, us-central1-locket-4252a.cloudfunctions.net, youtubei.googleapis.com, www.youtube.com, s.youtube.com, *.googlevideo.com
